server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss
        image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # V3 policy review / Safe observation uses the longer sequential-audit
    # budget. This regex precedes the generic /admin/ location.
    location ~ ^/admin/v1/projects/[0-9]+/ido-v3/policy/(?:preview|status|reviews(?:/[0-9]+(?:/(?:approve|observe|safe-handoff|safe-proposal))?)?)/?$ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # V3 policy client 170s < proxy 175s < Core hard cap 180s.
        proxy_read_timeout 175s;
        proxy_send_timeout 175s;
        client_max_body_size 25m;
    }

    # V3 operator actions recheck creation and simulate at a confirmed
    # block before a single durable send. 150s Core < 160s Admin < 165s proxy
    # < 180s Core server; other Admin APIs keep the generic 60s timeout.
    location ~ ^/admin/v1/projects/[0-9]+/(?:create-onchain|activate-onchain|end|withdraw-platform-fee)/?$ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 165s;
        proxy_send_timeout 165s;
        client_max_body_size 25m;
    }

    # Backend admin API proxy — admin UI 调 /admin/v1/*，nginx 把它转给 backend
    location /admin/ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25m;   # 允许 upload endpoint 通过（20MB 上限 + 头部余量）
    }

    # 上传文件（TipTap 图片 / Documents PDF）— admin 前端会直接 <img src="/uploads/xxx">
    location /uploads/ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location = /health {
        return 200 'admin-ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback —— index.html 不缓存，js/css（含 hash）走上面的长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
