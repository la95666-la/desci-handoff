server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/xml+rss
        image/svg+xml;

    # Long-cache fingerprinted Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Team 路由与 public/team 静态目录同名冲突：/team 必须走 SPA fallback
    # （精确匹配优先于正则缓存 location；否则 try_files 目录探测 301→/team/→404）
    location = /team {
        try_files /index.html =404;
    }

    # Public brand / figma / news images
    # team 已从缓存名单移除：路由 /team 是 SPA 页，照片走下方 try_files 普通路径
    location ~ ^/(brand|figma|projects|news|splash)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Backend API proxy
    location /client/ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传文件（Documents / TipTap 图片）走 backend static，nginx 只做 proxy
    location /uploads/ {
        proxy_pass         http://backend:13004;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        client_max_body_size 25m;
    }

    location = /health {
        proxy_pass http://backend:13004/health;
    }

    # WebSocket notification service is not deployed in this stack.
    # Uncomment when cmd/notice container is added to docker-compose.
    # location /ws/ {
    #     proxy_pass         http://notice:13005;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host    $host;
    #     proxy_read_timeout 3600s;
    # }

    # SPA fallback —— index.html 不缓存，assets（含 hash）走上面的长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
