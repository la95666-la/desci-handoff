# nginx 反代示例 —— 前置终结 TLS + 反向代理到 jc-release-server 的本地端口
#
# 放到 /etc/nginx/sites-available/jc-release.conf 并 ln -s 到 sites-enabled/
# 配合 certbot: certbot --nginx -d jc-release.example.com

server {
    listen 80;
    server_name jc-release.example.com;

    # HTTP → HTTPS 强制跳转 (certbot 会自动加上这一段，可先注释)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jc-release.example.com;

    ssl_certificate     /etc/letsencrypt/live/jc-release.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jc-release.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传包最大 1GB (跟 handleUploadRelease 的 1GB 一致)
    client_max_body_size 1024M;

    # 上传/下载超时放宽
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    send_timeout        600s;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 保持连接
        proxy_set_header   Connection        "";
    }
}
