<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/joincare-avatar-green-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JoinCare - Own the Future of Medicine</title>
    <meta name="description" content="A biomedical innovation protocol owned and driven by a global community. Fund Medicine, Own the Future." />
    <meta name="keywords" content="JoinCare,DeSci,DAO,biomedical,Web3,IDO,blockchain,medical research,IP-NFT" />
    <meta name="theme-color" content="#74f5a1" />
    <link rel="canonical" href="https://joincarelabs.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JoinCare" />
    <meta property="og:url" content="https://joincarelabs.com/" />
    <meta property="og:title" content="JoinCare - Own the Future of Medicine" />
    <meta property="og:description" content="A biomedical innovation protocol owned and driven by a global community. Fund Medicine, Own the Future." />
    <meta property="og:image" content="https://joincarelabs.com/brand/joincare-x-card-1200x630-v1.png" />
    <meta property="og:image:secure_url" content="https://joincarelabs.com/brand/joincare-x-card-1200x630-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JoinCare logo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@joincare" />
    <meta name="twitter:title" content="JoinCare - Own the Future of Medicine" />
    <meta name="twitter:description" content="A biomedical innovation protocol owned and driven by a global community." />
    <meta name="twitter:image" content="https://joincarelabs.com/brand/joincare-x-summary-800x800-v2.png" />
    <meta name="twitter:image:alt" content="JoinCare logo" />
    <!--
      Stitch-aligned font set via fonts.loli.net (China-friendly Google Fonts mirror).
      gstatic.loli.net is the woff2 mirror — preconnect both so the TLS handshake
      starts before HTML parsing reaches the link tag.
    -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <!-- Text fonts: variable weight 100..900 -->
    <link
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Hanken+Grotesk:wght@100..900&family=Inter:wght@100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    />
    <!-- Material Symbols: local font file, avoids mobile network fallback showing ligature text. -->
    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/material-symbols-outlined.ttf') format('truetype');
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif !important;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: 'liga';
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <!-- 在任何模块脚本之前执行：彻底关闭浏览器原生滚动恢复 -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
      // 在 load 时再保险一次：异步资源/Vue 测高后文档变高，浏览器仍可能延迟恢复
      window.addEventListener('load', () => window.scrollTo(0, 0))
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
